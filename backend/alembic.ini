# A generic, single database configuration.

[alembic]

# Path to migration scripts
script_location = %(here)s/alembic

# Template used to generate migration file names
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Add project root to Python path
prepend_sys_path = .

# Timezone
# timezone =

# Maximum slug length
# truncate_slug_length = 40

# Run environment during revision command
# revision_environment = false

# Search source files recursively
# sourceless = false

# Version locations
# version_locations = %(here)s/alembic/versions

# Path separator
path_separator = os

# Database URL
#
# IMPORTANT:
# The actual DATABASE_URL is loaded from
# app.core.config.settings inside alembic/env.py.
#
# This value is only a placeholder.
#
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

# Format using black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# =========================================================
# LOGGING
# =========================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S